services:

 mongo:
  container_name: my-app-db
  image: mongo:latest
  restart: unless-stopped
  env_file: .env.development
  ports:
   - "27017:27017"
  volumes:
  - mongo-data:/data/db
  environment:
    - CHOKIDAR_USEPOLLING=true
  
 api:
  container_name: api
  build: ./api
  restart: always
  ports:
   - "3000:3000"
  volumes:
   - ./api:/usr/src/app
   - /usr/src/app/node_modules
  # links:
  #  - mongo

volumes:
  mongo-data: